<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huy Kể Chuyện · Studio</title>
<style>
  :root { --red: #a3261c; --bronze: #c98a2a; --ink: #2a160a; --paper: #fbf5e9; --card: #fffdf8; --line: #e6d6b8; --muted: #7a6650; --green: #2f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 22px; background: var(--red); color: #fff8e6; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header .pill { background: rgba(255,255,255,.15); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  header .grow { flex: 1; }
  .bar { width: 160px; height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .bar i { display: block; height: 100%; background: #ffd27a; }
  nav { display: flex; gap: 4px; padding: 10px 22px 0; border-bottom: 2px solid var(--line); }
  nav button { border: 0; background: none; padding: 9px 14px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  nav button.on { color: var(--red); border-color: var(--red); font-weight: 700; }
  nav .n { background: var(--bronze); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; margin-left: 5px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 100px); }
  #list { border-right: 2px solid var(--line); overflow-y: auto; padding: 12px; }
  .job { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 10px; cursor: pointer; }
  .job:hover, .job.on { border-color: var(--bronze); box-shadow: 0 2px 8px rgba(120,80,20,.12); }
  .job b { display: block; font-size: 16px; }
  .job small { color: var(--muted); }
  .st { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-top: 5px; background: #eee3cc; }
  .st.review, .st.video { background: #ffe1a8; } .st.failed { background: #f6c8c0; } .st.done { background: #cfe8cf; } .st.producing, .st.approved { background: #d8e4f4; }
  #detail { overflow-y: auto; padding: 20px 28px 60px; }
  #detail h2 { margin: 0 0 4px; font-size: 26px; color: var(--red); }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; position: sticky; top: 0; background: var(--paper); padding: 10px 0; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .actions button { font: inherit; font-size: 15px; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 2px solid; }
  .ok { background: var(--green); color: #fff; border-color: var(--green); }
  .fixb { background: #fff; color: #9a5a00; border-color: #e0a84a; }
  .no { background: #fff; color: var(--red); border-color: #e3a29a; }
  textarea { width: 100%; min-height: 70px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); }
  #note { display: none; flex-basis: 100%; }
  section { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
  section h3 { margin: 0 0 10px; font-size: 17px; }
  .sheet img { width: 100%; border-radius: 10px; cursor: zoom-in; }
  .scene { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .scene:last-child { border: 0; }
  .num { color: var(--bronze); font-weight: 700; }
  .tell { margin: 2px 0; line-height: 1.55; }
  .say { margin: 4px 0 4px 10px; padding: 4px 10px; border-left: 3px solid var(--bronze); background: #fff7e6; border-radius: 0 8px 8px 0; line-height: 1.5; }
  .who { font-weight: 700; color: var(--red); }
  .how { color: var(--muted); font-style: italic; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .play { border: 0; background: var(--bronze); color: #fff; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; }
  video { width: 100%; border-radius: 12px; background: #000; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .notes li { margin-bottom: 6px; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; z-index: 9; overflow: auto; cursor: zoom-out; }
  .zoom img { width: 100%; }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 10px 0 16px; }
  .sty { border: 2.5px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; background: #fff; position: relative; }
  .sty:hover { border-color: var(--bronze); }
  .sty.on { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,122,58,.25); }
  .sty img, .sty .ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eee3cc; }
  .sty .ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .sty b { display: block; padding: 6px 9px 0; font-size: 15px; }
  .sty small { display: block; padding: 0 9px 8px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .star { position: absolute; top: 6px; left: 6px; background: #ffd25a; color: #5a3a00; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
  .chosen { position: absolute; top: 6px; right: 6px; background: var(--green); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .themes select { font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); width: 100%; margin: 6px 0; }
  .themes video { border-radius: 10px; }
  .warn { background: #fff0d6; border: 1.5px solid #e8b25a; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  .dls { display:flex; gap:10px; flex-wrap:wrap } a.dl { display:inline-block; padding:7px 14px; border-radius:8px; background:#2e7d32; color:#fff; text-decoration:none; font-weight:600 } a.dl:hover { background:#256628 }
</style>
</head>
<body>
<header>
  <h1>Huy Kể Chuyện · Studio</h1>
  <span class="pill" id="sched">…</span>
  <span class="grow"></span>
  <span class="pill" id="tok">…</span>
</header>
<nav id="tabs"></nav>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Chọn một mục bên trái.</div></div>
</main>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoomImg"></div>
<audio id="audio"></audio>
<script>
const TABS = [
  ["wait", "Chờ bạn duyệt", ["review", "video"]],
  ["work", "Đang làm", ["writing", "rewrite", "approved", "producing", "fix"]],
  ["done", "Xong", ["done"]],
  ["off", "Bỏ / Lỗi", ["rejected", "failed"]],
  ["tokens", "Token", []],
  ["youtube", "Đăng YouTube", []],
];
const STATUS = { writing: "đang viết", review: "chờ duyệt kịch bản", rewrite: "đang viết lại", approved: "đã duyệt, chờ làm", producing: "đang làm video", video: "chờ duyệt video", fix: "chờ sửa video", done: "xong", rejected: "đã bỏ", failed: "lỗi" };
const TASK = { write: "viết kịch bản", prepare: "chuẩn bị video", render: "render video", shorts: "cắt Shorts", english: "chuẩn bị bản tiếng Anh", "english-render": "render bản tiếng Anh", topics: "đề xuất chủ đề" };
let tab = "wait", jobs = [], current = null, sched = null, ART = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("vi");
const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "vừa xong" : m < 60 ? `${m} phút trước` : m < 1440 ? `${Math.round(m / 60)} giờ trước` : `${Math.round(m / 1440)} ngày trước`; };

async function load() {
  const r = await fetch("/api/jobs").then((r) => r.json());
  jobs = r.jobs; sched = r.scheduler;
  const t = await fetch("/api/tokens").then((r) => r.json());
  const pct = Math.min(100, (t.today / t.settings.perDayTokens) * 100);
  $("#tok").innerHTML = t.settings.paused ? `⏸ Claude đang tạm dừng · <a href="#" style="color:#ffd27a" onclick="setPaused(false);return false">Tiếp tục tự động</a>`
    : `Token hôm nay: ${fmt(t.today)} / ${fmt(t.settings.perDayTokens)} <span class="bar"><i style="width:${pct}%"></i></span>`;
  $("#sched").textContent = !sched ? "Bộ lập lịch chưa chạy" : sched.lastError && !sched.task ? `⚠ ${sched.lastError}` :
    `${sched.window === "office" ? "Giờ hành chính: việc nhẹ" : "Ngoài giờ: được render"} · ${sched.task ? `đang ${TASK[sched.task.what] || sched.task.what}${sched.task.slug ? `: ${sched.task.slug}` : ""}` : "đang chờ việc"}`;
  drawTabs(); drawList();
}

function drawTabs() {
  $("#tabs").innerHTML = TABS.map(([k, label, sts]) => {
    const n = jobs.filter((j) => sts.includes(j.status)).length;
    return `<button class="${k === tab ? "on" : ""}" onclick="tab='${k}';current=null;load();${k === "tokens" ? "showTokens()" : k === "youtube" ? "showYoutube()" : ""}">${label}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("");
}

function drawList() {
  const sts = TABS.find((t) => t[0] === tab)[2];
  if (tab === "tokens" || tab === "youtube") { $("#list").innerHTML = ""; return; }
  const list = jobs.filter((j) => sts.includes(j.status));
  $("#list").innerHTML = list.length ? list.map((j) => `
    <div class="job ${current === j.slug ? "on" : ""}" onclick="show('${j.slug}')">
      <b>${esc(j.topic)}</b>
      <small>${j.kind === "qa" ? "hỏi–đáp (tiếng Anh)" : j.kind === "qa-vi" ? "hỏi–đáp (tiếng Việt)" : `${esc(j.kind || "")} · ${esc(j.era || "")}`} · ${fmt(j.tokens)} token${j.score ? ` · ${j.score.value}/10` : ""}${j.autoPicked ? " · tự chọn" : ""}</small><br>
      <span class="st ${j.status}">${STATUS[j.status] || j.status}</span>
      <small> ${ago(j.history.at(-1).at)}</small>
    </div>`).join("") : `<div class="empty">Trống.</div>`;
}

/** A download button for a file of the job (named after the job, ready to upload). */
const dl = (slug, file, label, name) => `<a class="dl" href="/files/${slug}/${file}" download="${esc(name || `${slug}-${file}`)}">⬇ ${label}</a>`;

async function show(slug) {
  current = slug; drawList(); history.replaceState(null, "", `#${slug}`);
  const d = await fetch(`/api/job/${slug}`).then((r) => r.json());
  const { job, plan, project, sources, files } = d;
  const has = (f) => files.includes(f);
  const voices = project?.voices || {};
  const voiceOf = (who) => { const v = voices[who]; return v ? (typeof v === "string" ? v : v.voice) : null; };
  const used = d.tokens.reduce((n, e) => n + e.input + e.cacheWrite + e.output + Math.round(e.cacheRead * 0.1), 0);
  const canReview = job.status === "review" || job.status === "video";
  const last = job.history.at(-1);
  // A question for the English question channel (qa.ts): no era, costumes or art yet.
  const qa = job.kind === "qa" || job.kind === "qa-vi";
  let h = `<h2>${esc(plan?.title || job.topic)}</h2>
    <div class="meta">${qa ? `Kênh hỏi–đáp (tiếng Anh) · ${esc(project?.channel || "")}` : `${esc(job.kind || "")} · thời đại ${esc(job.era || "?")}`} · ${STATUS[job.status]} · viết bởi ${esc(job.by || "?")} · ${fmt(used)} token</div>`;
  if (canReview || job.status === "failed" || job.status === "rejected") {
    h += `<div class="actions">
      ${canReview ? `<button class="ok" onclick="act('approve')">✔ Duyệt ${job.status === "video" ? "video" : qa ? "kịch bản" : "kịch bản và trang phục"}</button>
      <button class="fixb" onclick="toggleNote()">✎ Yêu cầu sửa…</button>` : ""}
      ${job.status === "failed" ? `<button class="ok" onclick="act('retry')">↻ Thử lại</button>` : ""}
      ${job.status === "rejected" ? `<button class="fixb" onclick="act('retry')">↩ Lấy lại để duyệt</button>` : ""}
      ${job.status !== "rejected" ? `<button class="no" onclick="if(confirm('Bỏ chủ đề này?'))act('reject')">✘ Bỏ</button>` : ""}
      <div id="note"><textarea id="noteText" placeholder="${job.status === "video" ? "Ví dụ: cảnh 5 mẹ phải đang nấu cơm; Sơn Tinh nói to hơn…" : qa ? "Ví dụ: giải thích thêm vì sao trời không màu tím; cảnh 26 có sáu loại cầu, không phải năm…" : "Ví dụ: thêm cảnh mẹ ru con; bớt cảnh đánh nhau; áo Mị Nương màu hồng…"}"></textarea>
        <button class="fixb" onclick="act('fix')">Gửi yêu cầu sửa</button></div>
    </div>`;
  }
  if (job.score) h += `<div class="meta">Điểm của bộ não: <b>${job.score.value}/10</b> — ${esc(job.score.why)}${job.autoPicked ? " · <b>studio tự chọn</b> (bạn chưa chọn trước giờ chốt)" : ""}</div>`;
  if (job.error) h += `<div class="warn">Lỗi: ${esc(job.error)}</div>`;
  else if (last?.info && /vấn đề/.test(last.info)) h += `<div class="warn">${esc(last.info)}</div>`;
  if (!qa) h += await artSection(job, d.art, d.redrawing);
  if (qa && plan) {
    const fc = has("factcheck.json") ? await fetch(`/files/${slug}/factcheck.json`).then((r) => r.json()).catch(() => null) : null;
    const shortWords = (plan.shorts || []).map((n) => plan.scenes[n - 1]).filter(Boolean).flatMap((s) => s.parts).reduce((n, p) => n + p.text.split(/\s+/).length, 0);
    h += `<section><h3>Câu trả lời</h3><p>${esc(plan.answer || "")}</p>
      <p><b>Chữ trên ảnh bìa:</b> ${esc(plan.thumbnail || "")}</p>
      <p><b>Shorts:</b> cảnh ${(plan.shorts || []).join(", ")} · ${shortWords} chữ (khoảng ${Math.round(shortWords / 2.5)} giây)</p>
      <p><b>Mô tả YouTube:</b> ${esc(plan.description || "")}</p></section>`;
    if (fc) h += `<section><h3>Soát sự thật · ${fc.issues.length ? `${fc.issues.length} chỗ đã sửa` : "không có chỗ sai"}</h3>${fc.issues.length ? `<ul>${fc.issues.map((x) => `<li><b>Cảnh ${x.scene}</b>: <s>${esc(x.quote)}</s><br><small>${esc(x.problem)}</small><br>→ ${esc(x.fix)}</li>`).join("")}</ul>` : ""}</section>`;
  }
  if (has("video.mp4")) h += `<section><h3>Video</h3><video controls preload="metadata" src="/files/${slug}/video.mp4" ${has("thumbnail.jpg") ? `poster="/files/${slug}/thumbnail.jpg"` : ""}></video>
    <p class="dls">${dl(slug, "video.mp4", "Tải video", `${slug}.mp4`)}${has("thumbnail.jpg") ? dl(slug, "thumbnail.jpg", "Tải ảnh bìa", `${slug}.jpg`) : ""}</p>
    ${has("thumbnail.jpg") ? `<p><b>Thumbnail</b></p><img style="width:50%;border-radius:10px" src="/files/${slug}/thumbnail.jpg">` : ""}</section>`;
  if (job.status === "done" || job.published) {
    const p = job.published || {}, item = (label, x) => x ? `<li>${label}: <a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a> · công khai ${new Date(x.publishAt).toLocaleString("vi")}</li>` : "";
    const list = [item("Video", p.long), item("Bản tiếng Anh", p.en), ...(p.shorts || []).map((x, i) => item(`Short ${i + 1}`, x))].join("");
    h += `<section><h3>YouTube</h3>${list ? `<ul>${list}</ul>` : `<p class="meta">${job.publishHold ? "Đang hoãn đăng." : "Sẽ được đăng khi kênh đã kết nối và bật (tab Đăng YouTube)."}</p>`}
      ${job.publishError ? `<div class="warn">Lần đăng trước lỗi: ${esc(job.publishError)} (thử lại sau 1 giờ)</div>` : ""}
      <p><button class="fixb" onclick="holdPublish(${!job.publishHold})">${job.publishHold ? "▶ Cho đăng" : "⏸ Hoãn đăng video này"}</button></p></section>`;
  }
  if (has("video.en.mp4")) h += `<section><h3>English version</h3><video controls preload="metadata" src="/files/${slug}/video.en.mp4" ${has("thumbnail.en.jpg") ? `poster="/files/${slug}/thumbnail.en.jpg"` : ""}></video>
    <p class="dls">${dl(slug, "video.en.mp4", "Tải video tiếng Anh", `${slug}-en.mp4`)}${has("thumbnail.en.jpg") ? dl(slug, "thumbnail.en.jpg", "Tải ảnh bìa tiếng Anh", `${slug}-en.jpg`) : ""}</p></section>`;
  else if (job.english) h += `<section><h3>English version</h3><div class="meta">${job.english === "ready" ? "Giọng tiếng Anh xong, render tối nay" : esc(job.english)}</div></section>`;
  if (job.shorts?.length) h += `<section><h3>Shorts (Reels, TikTok) · ${job.shorts.length} clip</h3><div style="display:flex;gap:14px;flex-wrap:wrap">${job.shorts.map((f, i) => `<div><video controls preload="metadata" style="width:240px;border-radius:12px" src="/files/${slug}/${f}"></video><br>${dl(slug, f, `Tải short ${i + 1}`, `${slug}-short-${i + 1}.mp4`)}</div>`).join("")}</div></section>`;
  if (has("costumes.png")) h += `<section class="sheet"><h3>Bảng trang phục</h3><img src="/files/${slug}/costumes.png?${Date.now()}" onclick="zoom(this.src)"></section>`;
  else if (plan && !qa) h += `<section><h3>Bảng trang phục</h3><div class="meta">Đang vẽ…</div><p>${esc(plan.look)}</p></section>`;
  if (job.notes.length) h += `<section><h3>Góp ý của bạn</h3><ul class="notes">${job.notes.map((n) => `<li><small>${new Date(n.at).toLocaleString("vi")} · ${n.on === "video" ? "video" : "kịch bản"}</small><br>${esc(n.text)}</li>`).join("")}</ul></section>`;
  if (plan) {
    h += `<section><h3>Kịch bản · ${plan.scenes.length} cảnh · ${plan.scenes.flatMap((s) => s.parts).reduce((n, p) => n + p.text.split(/\s+/).length, 0)} chữ</h3>` +
      plan.scenes.map((s, i) => `<div class="scene"><div class="num">${i + 1}</div><div>${s.visual ? `<div class="meta">${esc(s.beat)}${s.step ? ` ${s.step}` : ""} · hình: <b>${esc(s.visual.kind)}</b> — ${esc(s.visual.what)}</div>` : ""}${s.parts.map((p) => p.who ? `<div class="say"><span class="who">${esc(p.who)}</span>${p.how ? ` <span class="how">(${esc(p.how)})</span>` : ""}: “${esc(p.text)}”</div>` : `<p class="tell">${esc(p.text)}</p>`).join("")}</div></div>`).join("") + `</section>`;
    h += `<section><h3>Nhân vật và giọng</h3><table><tr><th>Nhân vật</th><th>Vai</th><th>Giọng</th><th></th></tr>` +
      plan.cast.map((c) => { const v = voices[c.name], name = voiceOf(c.name); return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td><td>${esc(name || "")}${v && v.pitch ? ` (cao độ ${v.pitch > 0 ? "+" : ""}${v.pitch})` : ""}</td><td>${name ? `<button class="play" title="Nghe giọng mẫu" onclick="play('${esc(name)}')">▶</button>` : ""}</td></tr>`; }).join("") +
      `<tr><td><b>Người kể</b></td><td></td><td>${esc(project?.voice || "")}</td><td><button class="play" onclick="play('${esc(project?.voice || "")}')">▶</button></td></tr></table></section>`;
    h += `<section><h3>Chi tiết chính và nguồn tư liệu</h3><ul>${plan.facts.map((f) => `<li>${esc(f.claim)} <small>(${esc(f.source)})</small></li>`).join("")}</ul>
      <p>${(sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a>`).join(" · ")}</p></section>`;
  }
  h += `<section><h3>Lịch sử</h3><table>${job.history.slice().reverse().map((x) => `<tr><td>${new Date(x.at).toLocaleString("vi")}</td><td>${STATUS[x.status] || x.status}</td><td>${esc(x.info || "")}</td></tr>`).join("")}</table></section>`;
  $("#detail").innerHTML = h;
}

/** Style, intro and outro: what the brain suggests (★) and what is chosen (✔); a click changes it. */
async function artSection(job, art, redrawing) {
  if (!art || job.status === "writing" || job.status === "rejected") return "";
  ART ||= await fetch("/api/art").then((r) => r.json());
  const sg = art.suggest || {};
  const styleName = (k) => ART.styles.find((s) => s.key === k)?.name || k, themeName = (k) => ART.themes.find((t) => t.key === k)?.name || k;
  const theme = (kind) => {
    const t = ART.themes.find((x) => x.key === art[kind]);
    return `<div><b>${kind === "intro" ? "Intro (mở đầu)" : "Outro (kết thúc)"}</b>
      <select onchange="setArt({ ${kind}: this.value })">${ART.themes.map((x) => `<option value="${x.key}" ${x.key === art[kind] ? "selected" : ""}>${x.key === sg[kind] ? "★ " : ""}${esc(x.name)}</option>`).join("")}</select>
      <div class="meta" style="margin:0 0 6px">${esc(t?.for || "")}</div>
      ${t?.[kind] ? `<video controls preload="metadata" src="${t[kind]}#t=${kind === "intro" ? 2.4 : 3.6}"></video>` : `<div class="meta">Chưa có video xem trước.</div>`}</div>`;
  };
  return `<section><h3>Phong cách vẽ, intro và outro</h3>
    <div class="meta">★ Gợi ý ${sg.by === "brain" ? "của bộ não" : "theo chủ đề"}: <b>${esc(styleName(sg.style))}</b> · intro ${esc(themeName(sg.intro))} · outro ${esc(themeName(sg.outro))}${sg.why ? `: <i>${esc(sg.why)}</i>` : ""}</div>
    <p style="margin:12px 0 4px"><b>Phong cách vẽ</b></p>
    <div class="styles">${ART.styles.map((s) => `<div class="sty ${s.key === art.style ? "on" : ""}" onclick="setArt({ style: '${s.key}' })" title="${esc(s.for)}">
      ${s.sample ? `<img src="${s.sample}">` : `<div class="ph">chưa có ảnh mẫu</div>`}
      ${s.key === sg.style ? `<span class="star">★ gợi ý</span>` : ""}${s.key === art.style ? `<span class="chosen">✔ đang chọn</span>` : ""}
      <b>${esc(s.name)}</b><small>${esc(s.for)}</small></div>`).join("")}</div>
    ${redrawing ? `<div class="warn">Đang vẽ lại bảng trang phục theo phong cách mới…</div>` : ""}
    <div class="themes">${theme("intro")}${theme("outro")}</div>
    ${job.status === "video" || job.status === "done" ? `<p><button class="fixb" style="font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid;cursor:pointer" onclick="rerender()">↻ Render lại video với lựa chọn này (tối nay)</button></p>` : ""}
  </section>`;
}
async function setArt(change) {
  const r = await fetch(`/api/job/${current}/art`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  const y = $("#detail").scrollTop;
  await show(current);
  $("#detail").scrollTop = y;
  if (r.redrawing) { const poll = setInterval(async () => { const d = await fetch(`/api/job/${current}`).then((x) => x.json()); if (!d.redrawing) { clearInterval(poll); const yy = $("#detail").scrollTop; await show(current); $("#detail").scrollTop = yy; } }, 4000); }
}
async function rerender() {
  if (!confirm("Render lại video này với phong cách, intro và outro đang chọn? (chạy vào buổi tối)")) return;
  const r = await fetch(`/api/job/${current}/rerender`, { method: "POST" }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); show(current);
}

function toggleNote() { const n = $("#note"); n.style.display = n.style.display === "block" ? "none" : "block"; if (n.style.display === "block") $("#noteText").focus(); }
async function act(action) {
  const note = action === "fix" ? $("#noteText").value : undefined;
  const r = await fetch(`/api/job/${current}/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ note }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); show(current);
}
function play(name) { const a = $("#audio"); a.src = `/voice/${encodeURIComponent(name)}`; a.play(); }
function zoom(src) { $("#zoomImg").src = src; $("#zoom").style.display = "block"; }

/** The YouTube channels: connect (Google sign-in), turn on, publishing times. */
async function showYoutube() {
  const p = await fetch("/api/publish").then((r) => r.json());
  const ready = p.client;
  $("#detail").innerHTML = `<h2>Đăng YouTube</h2>
    <section><p>Video bạn duyệt xong (tab "Xong") được studio tải lên kênh ở chế độ riêng tư, kèm giờ công khai: đến giờ YouTube tự công khai. Ảnh bìa, tiêu đề, mô tả có nguồn tư liệu, thẻ, "dành cho trẻ em" được điền sẵn. Shorts đăng sau video chính (kèm link), bản tiếng Anh lên kênh tiếng Anh.</p>
    ${ready ? "" : `<div class="warn">Chưa có <b>studio/secrets/client_secret.json</b>. Làm theo README, mục "Kết nối YouTube" (tạo dự án Google Cloud, bật YouTube Data API v3, tạo OAuth client loại Desktop, tải file JSON về đặt vào đó), rồi tải lại trang này.</div>`}</section>
    ${p.channels.map((c) => `<section><h3>${esc(c.name)} <small>(${c.lang === "vi" ? "tiếng Việt" : "tiếng Anh"})</small></h3>
      <p>${c.connected ? `✔ Đã kết nối: <b>${esc(c.channelTitle || "")}</b>` : "Chưa kết nối"}
        ${ready ? `<a class="dl" style="margin-left:10px" href="/oauth/start?channel=${encodeURIComponent(c.key)}">${c.connected ? "Kết nối lại" : "Kết nối kênh"}</a>` : ""}</p>
      <p><label><input type="checkbox" id="on-${c.key}" ${c.enabled ? "checked" : ""} ${c.connected ? "" : "disabled"}> Tự động đăng lên kênh này</label></p>
      <table><tr><td>Giờ công khai video chính</td><td><input id="long-${c.key}" value="${esc(c.long.join(", "))}"></td></tr>
      <tr><td>Giờ công khai Shorts</td><td><input id="shorts-${c.key}" value="${esc(c.shorts.join(", "))}"></td></tr></table>
      <p><button class="fixb" style="padding:8px 14px;border-radius:10px;border:2px solid;cursor:pointer" onclick="savePublish('${c.key}')">Lưu</button></p></section>`).join("")}`;
}
async function savePublish(key) {
  const split = (v) => v.split(/[,\s]+/).filter(Boolean);
  await fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel: key, enabled: $(`#on-${key}`).checked, long: split($(`#long-${key}`).value), shorts: split($(`#shorts-${key}`).value) }) });
  showYoutube();
}
async function holdPublish(hold) {
  await fetch(`/api/job/${current}/hold`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hold }) });
  show(current);
}

async function showTokens() {
  const t = await fetch("/api/tokens").then((r) => r.json());
  const byJob = {};
  for (const e of t.entries) { const k = e.job; (byJob[k] ||= { n: 0, w: 0, out: 0 }); byJob[k].n++; byJob[k].w += e.weighted; byJob[k].out += e.output; }
  const st = t.settings;
  $("#detail").innerHTML = `<h2>Token đã dùng</h2>
    <section><h3>Điều khiển</h3>
      <p>${st.paused ? "⏸ <b>Claude đang tạm dừng</b>: việc cần Claude (viết kịch bản, chỉ đạo cảnh, dựng thời đại) đang chờ; render vẫn chạy." : "▶ <b>Đang tự động</b>: Claude làm việc trong giới hạn bên dưới."}</p>
      <p><button class="${st.paused ? "ok" : "no"}" style="font-size:16px;padding:10px 18px;border-radius:10px;border:2px solid;cursor:pointer" onclick="setPaused(${!st.paused})">${st.paused ? "▶ Tiếp tục tự động" : "⏸ Tạm dừng Claude (tôi cần token)"}</button></p>
      <table>
        <tr><td>Trần mỗi ngày</td><td><input id="capDay" type="number" step="10000" value="${st.perDayTokens}"></td></tr>
        <tr><td>Trần mỗi kịch bản (viết + trang phục + thời đại mới)</td><td><input id="capJob" type="number" step="10000" value="${st.perJobTokens}"></td></tr>
        <tr><td>Trần mỗi lần làm video (chỉ đạo cảnh, sửa)</td><td><input id="capProd" type="number" step="10000" value="${st.perProduceTokens}"></td></tr>
      </table>
      <p><button class="fixb" style="font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid;cursor:pointer" onclick="saveCaps()">Lưu giới hạn</button></p>
    </section>
    <div class="meta">Hôm nay ${fmt(t.today)} / trần ${fmt(t.settings.perDayTokens)} · trần mỗi kịch bản ${fmt(t.settings.perJobTokens)} · trần mỗi lần làm video ${fmt(t.settings.perProduceTokens)}. Token "quy đổi": token đọc lại từ bộ nhớ đệm tính 1/10.</div>
    <section><h3>Theo chủ đề</h3><table><tr><th>Chủ đề</th><th>Lần gọi</th><th>Token quy đổi</th><th>Token Claude viết ra</th></tr>
    ${Object.entries(byJob).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${fmt(v.w)}</td><td>${fmt(v.out)}</td></tr>`).join("")}</table></section>
    <section><h3>Từng lần gọi (mới nhất trước)</h3><table><tr><th>Lúc</th><th>Chủ đề</th><th>Bước</th><th>Mô hình</th><th>Token</th><th>Giây</th></tr>
    ${t.entries.slice().reverse().slice(0, 100).map((e) => `<tr><td>${new Date(e.at).toLocaleString("vi")}</td><td>${esc(e.job)}</td><td>${esc(e.step)}</td><td>${esc(e.model)}</td><td>${fmt(e.weighted)}${e.ok ? "" : " ✘"}</td><td>${e.seconds}</td></tr>`).join("")}</table></section>`;
}

window.renderFrame = () => {};
window.ready = new Promise((r) => setTimeout(r, 2500)); // for screenshots
async function setPaused(paused) {
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paused }) });
  await load(); if (tab === "tokens") showTokens();
}
async function saveCaps() {
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ perDayTokens: $("#capDay").value, perJobTokens: $("#capJob").value, perProduceTokens: $("#capProd").value }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); showTokens();
}
load().then(() => { if (location.hash === "#youtube" || location.hash === "#tokens") { tab = location.hash.slice(1); drawTabs(); $("#list").innerHTML = ""; return tab === "youtube" ? showYoutube() : showTokens(); } const slug = decodeURIComponent(location.hash.slice(1)); if (slug && jobs.some((j) => j.slug === slug)) { const j = jobs.find((x) => x.slug === slug); tab = (TABS.find((t) => t[2].includes(j.status)) || TABS[0])[0]; drawTabs(); show(slug); } });
setInterval(() => { load(); }, 15000);
</script>
</body>
</html>
