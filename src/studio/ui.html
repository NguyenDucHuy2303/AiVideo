<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huy Kể Chuyện · Studio</title>
<style>
  :root { --red: #a3261c; --bronze: #c98a2a; --ink: #2a160a; --paper: #fbf5e9; --card: #fffdf8; --line: #e6d6b8; --muted: #7a6650; --green: #2f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 22px; background: var(--red); color: #fff8e6; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header .pill { background: rgba(255,255,255,.15); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  header .grow { flex: 1; }
  .bar { width: 160px; height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .bar i { display: block; height: 100%; background: #ffd27a; }
  nav { display: flex; gap: 4px; padding: 10px 22px 0; border-bottom: 2px solid var(--line); }
  nav button { border: 0; background: none; padding: 9px 14px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  nav button.on { color: var(--red); border-color: var(--red); font-weight: 700; }
  nav .n { background: var(--bronze); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; margin-left: 5px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 100px); }
  #list { border-right: 2px solid var(--line); overflow-y: auto; padding: 12px; }
  .job { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 10px; cursor: pointer; }
  .job:hover, .job.on { border-color: var(--bronze); box-shadow: 0 2px 8px rgba(120,80,20,.12); }
  .job b { display: block; font-size: 16px; }
  .job small { color: var(--muted); }
  .st { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-top: 5px; background: #eee3cc; }
  .st.review { background: #ffe1a8; } .st.video { background: #d9ccf5; color: #3d2a7a; font-weight: 600; }
  nav .t-video .n { background: #6a4fc0; }
  .step { border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; font-size: 14px; border-left: 6px solid; }
  .step b { font-size: 16px; display: block; margin-bottom: 2px; }
  .step.review { background: #fff4dc; border-color: #e0a030; } .step.video { background: #efe9fc; border-color: #6a4fc0; } .st.failed { background: #f6c8c0; } .st.done { background: #cfe8cf; } .st.producing, .st.approved { background: #d8e4f4; }
  #detail { overflow-y: auto; padding: 20px 28px 60px; }
  #detail h2 { margin: 0 0 4px; font-size: 26px; color: var(--red); }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; position: sticky; top: 0; background: var(--paper); padding: 10px 0; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .actions button { font: inherit; font-size: 15px; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 2px solid; }
  .ok { background: var(--green); color: #fff; border-color: var(--green); }
  .fixb { background: #fff; color: #9a5a00; border-color: #e0a84a; }
  .no { background: #fff; color: var(--red); border-color: #e3a29a; }
  textarea { width: 100%; min-height: 70px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); }
  #note { display: none; flex-basis: 100%; }
  section { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
  section h3 { margin: 0 0 10px; font-size: 17px; }
  .sheet img { width: 100%; border-radius: 10px; cursor: zoom-in; }
  .scene { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .scene:last-child { border: 0; }
  .num { color: var(--bronze); font-weight: 700; }
  .tell { margin: 2px 0; line-height: 1.55; }
  .say { margin: 4px 0 4px 10px; padding: 4px 10px; border-left: 3px solid var(--bronze); background: #fff7e6; border-radius: 0 8px 8px 0; line-height: 1.5; }
  .who { font-weight: 700; color: var(--red); }
  .how { color: var(--muted); font-style: italic; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .play { border: 0; background: var(--bronze); color: #fff; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; }
  video { width: 100%; border-radius: 12px; background: #000; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .notes li { margin-bottom: 6px; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; z-index: 9; overflow: auto; cursor: zoom-out; }
  .zoom img { width: 100%; }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 10px 0 16px; }
  .sty { border: 2.5px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; background: #fff; position: relative; }
  .sty:hover { border-color: var(--bronze); }
  .sty.on { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,122,58,.25); }
  .sty img, .sty .ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #eee3cc; }
  .sty .ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .sty b { display: block; padding: 6px 9px 0; font-size: 15px; }
  .sty small { display: block; padding: 0 9px 8px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .star { position: absolute; top: 6px; left: 6px; background: #ffd25a; color: #5a3a00; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
  .chosen { position: absolute; top: 6px; right: 6px; background: var(--green); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .themes select { font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); width: 100%; margin: 6px 0; }
  .themes video { border-radius: 10px; }
  p.frow { margin: 6px 0 2px; font-size: 14px; }
  p.frow.must { background: #fff3d6; border-left: 4px solid #e0a84a; padding: 4px 8px; border-radius: 4px; }
  /* Lời đăng: a video picker, platform tabs, then what to paste (left) and what to pick (right). */
  .vpick { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .vp { font: inherit; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; min-width: 150px; line-height: 1.35; }
  .vp:hover { border-color: var(--bronze); }
  .vp.on { border-color: var(--red); background: #fff6ee; box-shadow: 0 2px 8px rgba(163,38,28,.12); }
  .vp b { display: block; font-size: 15px; }
  .vp small { color: var(--muted); font-size: 12.5px; display: block; }
  .vp .marks { font-size: 12px; margin-top: 3px; color: var(--muted); }
  .vp .marks i { font-style: normal; color: var(--green); font-weight: 700; }
  .ppane { display: none; } .ppane.on { display: block; }
  .ptabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); margin-bottom: 14px; }
  .ptab { font: inherit; font-size: 15px; border: 0; background: none; padding: 8px 16px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .ptab.on { color: var(--ink); font-weight: 700; border-color: var(--red); }
  .ptab .ok-mark { color: var(--green); font-size: 13px; margin-left: 4px; }
  .facts { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .fact { background: #fff3d6; border: 1.5px solid #ecc77a; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  .fact small { display: block; color: var(--muted); font-size: 12px; }
  .pgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1250px) { .pgrid { grid-template-columns: 1fr; } }
  .colh { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .fld { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 12px; overflow: hidden; }
  .fh { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; background: #faf3e6; border-bottom: 1px solid var(--line); }
  .fh b { font-size: 15px; } .fh small { color: var(--muted); font-size: 12.5px; } .fh small.over { color: #b3261e; font-weight: 700; }
  .fh .grow { flex: 1; }
  .fv { padding: 10px 12px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .fn { padding: 0 12px 8px; font-size: 12.5px; color: var(--muted); }
  button.cp { font: inherit; font-size: 14px; font-weight: 600; padding: 5px 14px; border-radius: 8px; border: 2px solid #e0a84a; background: #fff; color: #9a5a00; cursor: pointer; white-space: nowrap; }
  button.cp:hover { background: #fff3d6; }
  button.cp.done { background: var(--green); border-color: var(--green); color: #fff; }
  .picks { list-style: none; margin: 0; padding: 0; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  .picks li { padding: 8px 12px; border-bottom: 1px solid #f0e6d2; font-size: 14px; line-height: 1.4; }
  .picks li:last-child { border: 0; }
  .picks .k { color: var(--muted); font-size: 13px; display: block; }
  .picks .v { font-weight: 600; }
  .picks .n { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .picks li.must { background: #fff8e8; }
  .picks li.must .k::before { content: "⚠ "; color: #c77700; }
  .ptail { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  details.fold { margin-bottom: 16px; } details.fold > summary { cursor: pointer; font-weight: 700; padding: 10px 18px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; } details.fold[open] > summary { margin-bottom: 10px; }
  table.posted td, table.posted th { padding: 7px 8px; } table.posted .nope { color: #b9a990; }
  table.kv td:first-child { color: var(--muted); width: 32%; }
  .warn { background: #fff0d6; border: 1.5px solid #e8b25a; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  .dls { display:flex; gap:10px; flex-wrap:wrap } a.dl { display:inline-block; padding:7px 14px; border-radius:8px; background:#2e7d32; color:#fff; text-decoration:none; font-weight:600 } a.dl:hover { background:#256628 }
</style>
</head>
<body>
<header>
  <h1>Huy Kể Chuyện · Studio</h1>
  <span class="pill" id="sched">…</span>
  <span class="grow"></span>
  <span class="pill" id="tok">…</span>
  <button class="pill" style="border:0;color:inherit;font:inherit;font-size:13px;cursor:pointer" onclick="showPhone()">📱 Điện thoại</button>
</header>
<nav id="tabs"></nav>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Chọn một mục bên trái.</div></div>
</main>
<div class="zoom" id="zoom" onclick="this.style.display='none'"><img id="zoomImg"></div>
<div class="zoom" id="phone" onclick="this.style.display='none'" style="cursor:default"><div onclick="event.stopPropagation()" style="background:#fffdf8;max-width:440px;margin:60px auto;border-radius:16px;padding:22px 26px;text-align:center" id="phoneBox"></div></div>
<audio id="audio"></audio>
<script>
// A phone opening this page goes to its own (/m): the buttons here work on the computer's folders (?full stays).
if (matchMedia("(max-width: 700px)").matches && !location.search.includes("full")) location.replace("/m" + location.hash);
const TABS = [
  ["script", "📝 Duyệt kịch bản", ["review"]],
  ["video", "🎬 Duyệt video", ["video"]],
  ["work", "Đang làm", ["writing", "rewrite", "approved", "producing", "fix"]],
  ["done", "📤 Chờ đăng", ["done"], (j) => j.post?.stage !== "all"],
  ["posted", "✔ Đã đăng hết", ["done"], (j) => j.post?.stage === "all"],
  ["off", "Bỏ / Lỗi", ["rejected", "failed"]],
  ["tokens", "Token", []],
  ["calendar", "📅 Lịch đăng", []],
  ["youtube", "Đăng YouTube", []],
];
const INSPECT_VI = { held: "giữ tay cứng", still: "đứng im", "prop-face": "đồ che mặt", "talk-covered": "nói khi bị che miệng", "head-cut": "khung cắt đầu", "faces-overlap": "mặt chồng nhau", "speaker-off": "người nói ngoài hình" };
const STATUS = { writing: "đang viết", review: "chờ duyệt kịch bản", rewrite: "đang viết lại", approved: "đã duyệt, chờ làm", producing: "đang làm video", video: "chờ duyệt video", fix: "chờ sửa video", done: "xong", rejected: "đã bỏ", failed: "lỗi" };
const TASK = { write: "viết kịch bản", prepare: "chuẩn bị video", render: "render video", shorts: "cắt Shorts", english: "chuẩn bị bản tiếng Anh", "english-render": "render bản tiếng Anh", topics: "đề xuất chủ đề", "auto-review": "kiểm tra để tự duyệt video", long: "tạo bản dài của Short" };
let tab = null, jobs = [], current = null, sched = null, ART = null, REVIEW_HOURS = 12;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("vi");
const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "vừa xong" : m < 60 ? `${m} phút trước` : m < 1440 ? `${Math.round(m / 60)} giờ trước` : `${Math.round(m / 1440)} ngày trước`; };

async function load() {
  const r = await fetch("/api/jobs").then((r) => r.json());
  jobs = r.jobs; sched = r.scheduler; REVIEW_HOURS = r.reviewHours ?? REVIEW_HOURS;
  // First open: the videos waiting (the last step, the most urgent), else the scripts.
  tab ||= jobs.some((j) => j.status === "video") ? "video" : "script";
  const t = await fetch("/api/tokens").then((r) => r.json());
  const pct = Math.min(100, (t.today / t.settings.perDayTokens) * 100);
  $("#tok").innerHTML = t.settings.paused ? `⏸ Claude đang tạm dừng · <a href="#" style="color:#ffd27a" onclick="setPaused(false);return false">Tiếp tục tự động</a>`
    : `Token hôm nay: ${fmt(t.today)} / ${fmt(t.settings.perDayTokens)} <span class="bar"><i style="width:${pct}%"></i></span>`;
  $("#sched").textContent = !sched ? "Bộ lập lịch chưa chạy" : sched.lastError && !sched.task ? `⚠ ${sched.lastError}` :
    `${sched.window === "office" ? "Giờ hành chính: việc nhẹ" : "Ngoài giờ: được render"} · ${sched.task ? `đang ${TASK[sched.task.what] || sched.task.what}${sched.task.slug ? `: ${sched.task.slug}` : ""}` : "đang chờ việc"}`;
  drawTabs(); drawList();
}

/** Is a job listed under a tab: its status, and for finished ones where its posting stands. */
const inTab = (j, t) => t[2].includes(j.status) && (!t[3] || t[3](j));
/** Where a finished topic's posting stands (publish.ts postState), as a badge and counts. */
const STAGE = { preparing: ["⏳ đang chuẩn bị Shorts", "#eee3cc"], ready: ["🆕 sẵn sàng đăng", "#ffe1a8"], downloaded: ["⬇ đã tải về, chưa đăng", "#d8e4f4"], partial: ["◐ đăng dở", "#e6d9f7"], all: ["✔ đã đăng hết", "#cfe8cf"] };
const postBadge = (p) => p ? `<span class="st" style="background:${STAGE[p.stage][1]}">${STAGE[p.stage][0]}</span>` : "";
const postCounts = (p) => p && p.stage !== "preparing" ? `<small>YouTube ${p.by.youtube[0]}/${p.by.youtube[1]} · TikTok ${p.by.tiktok[0]}/${p.by.tiktok[1]} · Facebook ${p.by.facebook[0]}/${p.by.facebook[1]}${p.downloaded ? ` · đã tải ${p.downloaded}/${p.items}` : ""}</small>` : "";

/** A coming occasion the topic is for (trends.ts): the review and the posting before its day. */
const occBadge = (j) => { const o = j.occasion; if (!o) return ""; const d = o.date.split("-").reverse().slice(0, 2).join("/");
  return `<span class="st" style="background:#ffd6cc" title="Chủ đề hợp dịp ${esc(o.short)} (${d}): studio làm trước các bài khác">${o.icon} ${esc(o.short)} ${d} · ${o.left ? `còn ${o.left} ngày` : "hôm nay"}${j.status === "review" ? ", duyệt sớm" : j.status === "done" ? ", đăng trước ngày này" : ""}</span> `; };

function drawTabs() {
  $("#tabs").innerHTML = TABS.map(([k, label, sts, more]) => {
    const n = k === "posted" ? 0 : jobs.filter((j) => inTab(j, [k, label, sts, more])).length;
    return `<button class="${k === tab ? "on" : ""} t-${k}" onclick="tab='${k}';current=null;load();${k === "tokens" ? "showTokens()" : k === "youtube" ? "showYoutube()" : k === "calendar" ? "showCalendar()" : ""}">${label}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("");
}

function drawList() {
  const t = TABS.find((x) => x[0] === tab);
  if (tab === "tokens" || tab === "youtube" || tab === "calendar") { $("#list").innerHTML = ""; return; }
  // Topics for a coming occasion first, the soonest first.
  const list = jobs.filter((j) => inTab(j, t)).sort((a, b) => (a.occasion?.left ?? 999) - (b.occasion?.left ?? 999));
  $("#list").innerHTML = list.length ? list.map((j) => `
    <div class="job ${current === j.slug ? "on" : ""}" onclick="show('${j.slug}')">
      <b>${esc(j.topic)}</b>
      <small>${j.kind === "qa" ? "hỏi–đáp (tiếng Anh)" : j.kind === "qa-vi" ? "hỏi–đáp (tiếng Việt)" : j.kind === "lesson" ? `Học tiếng Anh cùng Huy${j.lessonFormat ? ` · ${j.lessonFormat.icon} ${esc(j.lessonFormat.name)}` : ""}` : j.kind === "fact" ? "Short Did you know? (Ask Huy)" : j.kind === "fact-vi" ? "Short Bạn có biết? (Hỏi Huy)" : `${esc(j.kind || "")} · ${esc(j.era || "")}`} · ${fmt(j.tokens)} token${j.score ? ` · ${j.score.value}/10` : ""}${j.autoPicked ? " · tự chọn" : ""}${j.fromShort ? " · 📺 bản dài của Short" : ""}${j.autoApproved ? " · studio tự duyệt video" : ""}${j.status === "video" && j.autoCheck && !j.autoCheck.ok ? " · ⚠ kiểm tra máy chưa đạt" : ""}</small><br>
      ${occBadge(j)}${j.post ? `${postBadge(j.post)}<br>${postCounts(j.post)}` : `<span class="st ${j.status}">${STATUS[j.status] || j.status}</span>
      <small> ${ago(j.history.at(-1).at)}</small>`}
    </div>`).join("") : `<div class="empty">Trống.</div>`;
}

/** A film's thumbnails (thumbnail.jpg, -2, -3; ".en" for the English one): to choose from, or to change to later. */
function thumbsOf(slug, has, en) {
  const files = ["", "-2", "-3"].map((k) => `thumbnail${k}${en}.jpg`).filter(has);
  if (!files.length) return "";
  return `<p><b>Ảnh bìa</b>${files.length > 1 ? ` · ${files.length} ảnh từ ${files.length} khoảnh khắc: đăng ảnh anh thấy hút mắt nhất; sau 3–4 ngày, tỷ lệ nhấp (CTR) thấp thì đổi ảnh khác (video cho trẻ em không dùng được thử A/B của YouTube)` : ""}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${files.map((f, i) => `<div style="flex:1;min-width:200px;max-width:32%"><img style="width:100%;border-radius:10px;cursor:zoom-in" src="/files/${slug}/${f}" onclick="zoom(this.src)"><br>${dl(slug, f, `Ảnh ${i + 1}`, `${slug}${en ? "-en" : ""}${i ? `-${i + 1}` : ""}.jpg`)}</div>`).join("")}</div>`;
}

/** A download button for a file of the job (named after the job, ready to upload). */
const dl = (slug, file, label, name) => `<a class="dl" href="/files/${slug}/${file}" download="${esc(name || `${slug}-${file}`)}">⬇ ${label}</a>`;

async function show(slug) {
  current = slug; drawList(); history.replaceState(null, "", `#${slug}`);
  const d = await fetch(`/api/job/${slug}`).then((r) => r.json());
  const { job, plan, project, sources, files } = d;
  const has = (f) => files.includes(f);
  const voices = project?.voices || {};
  const voiceOf = (who) => { const v = voices[who]; return v ? (typeof v === "string" ? v : v.voice) : null; };
  const used = d.tokens.reduce((n, e) => n + e.input + e.cacheWrite + e.output + Math.round(e.cacheRead * 0.1), 0);
  const canReview = job.status === "review" || job.status === "video";
  const last = job.history.at(-1);
  // A question for the English question channel (qa.ts): no era, costumes or art yet.
  const qa = ["qa", "qa-vi", "fact", "fact-vi", "lesson"].includes(job.kind);
  // Which step this is, plain to see before anything else.
  const step = job.status === "review" ? `<div class="step review"><b>📝 Bước 1/2 · Duyệt kịch bản</b>Đọc kịch bản${qa ? "" : ", xem nhân vật và trang phục"}. Duyệt thì studio làm giọng, tranh nền và render video (ngoài giờ hành chính), rồi video quay lại đây ở tab “Duyệt video”.</div>`
    : job.status === "video" ? `<div class="step video"><b>🎬 Bước 2/2 · Duyệt video</b>Xem video thành phẩm. Duyệt thì studio ${job.kind?.startsWith("fact") ? "" : `cắt Shorts${qa ? "" : ", làm bản tiếng Anh"} và `}đưa vào hàng đăng YouTube.${REVIEW_HOURS ? ` Anh chưa duyệt sau ${REVIEW_HOURS} giờ thì studio tự kiểm tra máy móc (đen màn, đứng hình, im lặng, độ dài) và tự duyệt nếu đạt.` : ""}</div>` : "";
  let h = `${step}<h2>${esc(plan?.title || job.topic)}</h2>
    <div class="meta">${qa ? `Kênh hỏi–đáp (tiếng Anh) · ${esc(project?.channel || "")}` : `${esc(job.kind || "")} · thời đại ${esc(job.era || "?")}`} · ${STATUS[job.status]} · viết bởi ${esc(job.by || "?")} · ${fmt(used)} token</div>`;
  if (canReview || job.status === "failed" || job.status === "rejected") {
    h += `<div class="actions">
      ${canReview ? `<button class="ok" onclick="act('approve')">✔ Duyệt ${job.status === "video" ? "video" : qa ? "kịch bản" : "kịch bản và trang phục"}</button>
      <button class="fixb" onclick="toggleNote()">✎ Yêu cầu sửa…</button>` : ""}
      ${job.status === "failed" ? `<button class="ok" onclick="act('retry')">↻ Thử lại</button>` : ""}
      ${job.status === "rejected" ? `<button class="fixb" onclick="act('retry')">↩ Lấy lại để duyệt</button>` : ""}
      ${job.status !== "rejected" ? `<button class="no" onclick="if(confirm('Bỏ chủ đề này?'))act('reject')">✘ Bỏ</button>` : ""}
      <div id="note"><textarea id="noteText" placeholder="${job.status === "video" ? "Ví dụ: cảnh 5 mẹ phải đang nấu cơm; Sơn Tinh nói to hơn…" : qa ? "Ví dụ: giải thích thêm vì sao trời không màu tím; cảnh 26 có sáu loại cầu, không phải năm…" : "Ví dụ: thêm cảnh mẹ ru con; bớt cảnh đánh nhau; áo Mị Nương màu hồng…"}"></textarea>
        <button class="fixb" onclick="act('fix')">Gửi yêu cầu sửa</button></div>
    </div>`;
  }
  if (job.score) h += `<div class="meta">Điểm của bộ não: <b>${job.score.value}/10</b> — ${esc(job.score.why)}${job.autoPicked ? " · <b>studio tự chọn</b> (bạn chưa chọn trước giờ chốt)" : ""}</div>`;
  if (job.inspect) h += `<div class="meta">Máy soi độ tự nhiên: <b>${job.inspect.perMinute} lỗi/phút</b>${Object.keys(job.inspect.byKind).length ? ` · ${Object.entries(job.inspect.byKind).map(([k, v]) => `${INSPECT_VI[k] || k} ${v.count}`).join(" · ")}` : " · không thấy lỗi"}</div>`;
  if (job.status === "video" && job.autoCheck && !job.autoCheck.ok) h += `<div class="warn">Studio chưa tự duyệt được video này, kiểm tra máy thấy: ${esc(job.autoCheck.problems.join("; "))}. Anh xem giúp.</div>`;
  if (job.autoApproved) h += `<div class="meta">✔ <b>Studio tự duyệt video</b> lúc ${new Date(job.autoApproved).toLocaleString("vi")} (anh chưa duyệt kịp, kiểm tra máy đạt). Chưa ưng thì bấm “Hoãn đăng” ở mục YouTube.</div>`;
  if ((job.kind === "fact" || job.kind === "fact-vi") && ["approved", "producing", "video", "done"].includes(job.status)) h += longSection(job);
  if (job.fromShort) h += `<div class="meta">📺 Bản dài của Short <a href="#${job.fromShort}" onclick="openFromCalendar('${job.fromShort}');return false">${esc(jobs.find((j) => j.slug === job.fromShort)?.topic || job.fromShort)}</a> (studio chọn bài này trước trong phần của dòng)</div>`;
  if (job.fbError) h += `<div class="warn">Đăng Facebook lỗi: ${esc(job.fbError)} (studio thử lại sau 30 phút; mã Trang hỏng thì báo em tạo lại)</div>`;
  if (job.error) h += `<div class="warn">Lỗi: ${esc(job.error)}</div>`;
  else if (last?.info && /vấn đề/.test(last.info)) h += `<div class="warn">${esc(last.info)}</div>`;
  if (job.status === "video") {
    // Waiting for review (or the studio's own approval): the words are ready already.
    const { posts } = await fetch(`/api/job/${slug}/social`).then((r) => r.json());
    if (posts.length) h += postWords(posts, () => null);
  }
  if (job.status === "done") {
    // Every video of the topic: downloaded, and posted where (the ticks work here too).
    const { posts } = await fetch(`/api/job/${slug}/social`).then((r) => r.json());
    const pub = job.published || {}, yt = (p) => p.what === "short" ? pub.shorts?.[p.index] : pub[p.what];
    const st = jobs.find((j) => j.slug === slug)?.post;
    const cell = (p, pl) => !p.text[pl] ? `<td style="color:#bbb">—</td>`
      : p.auto?.includes(pl) ? `<td>${p.done[pl] ? "✔ studio đã đăng" : "<span class='nope'>studio tự đăng</span>"}</td>`
      : `<td><label style="cursor:pointer"><input type="checkbox" ${p.done[pl] ? "checked" : ""} onchange="socialDone('${pl}', '${p.what}', ${p.index ?? "undefined"}, this.checked)"> ${p.done[pl] ? "✔ đã đăng" : "<span class='nope'>chưa</span>"}</label></td>`;
    if (posts.length) h += `<section><h3>Đã tải, đã đăng ở đâu ${postBadge(st)}</h3><table class="posted">
      <tr><th>Video</th><th>Giờ đăng</th><th>Đã tải về</th><th>YouTube</th><th>TikTok</th><th>Facebook</th></tr>
      ${posts.map((p) => `<tr><td><b>${esc(p.label)}</b><br><small class="meta">${esc(p.name)}</small></td>
        <td>${p.publishAt ? new Date(p.publishAt).toLocaleString("vi", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "<span class='nope'>chưa xếp</span>"}</td>
        <td>${job.downloaded?.[p.file] ? `✔ ${new Date(job.downloaded[p.file]).toLocaleString("vi", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" })}` : "<span class='nope'>chưa</span>"}</td>
        <td>${yt(p) ? `<a href="${esc(yt(p).url)}" target="_blank">✔ đã đăng</a>` : "<span class='nope'>chưa</span>"}</td>${cell(p, "tiktok")}${cell(p, "facebook")}</tr>`).join("")}</table>
      <p class="meta">Tải về: bấm nút ở mục Video, hoặc lấy trong thư mục ~/youtube. YouTube: dán link ở mục YouTube bên dưới. TikTok: tích vào ô khi đã đăng. Facebook: studio tự đăng Reel đúng giờ. Đủ dấu ✔ thì bài chuyển sang tab “✔ Đã đăng hết”.</p></section>`;
    if (posts.length) h += postWords(posts, yt);
  }
  if (!qa) { const art = await artSection(job, d.art, d.redrawing); h += job.status === "done" && art ? `<details class="fold"><summary>🎨 Phong cách vẽ, intro và outro <small class="meta">(đổi thì render lại)</small></summary>${art}</details>` : art; }
  if (d.formats && !plan?.story) h += formatSection(job, d.format, d.formats);
  if (plan?.story) h += `<section><h3>🎬 Tập phim · ${plan.scenes.length} cảnh</h3><p><b>Từ tiếng Anh:</b> ${esc(plan.answer || "")}</p><p class="meta">${esc(plan.description || "")}</p><p class="meta">Mỗi bài là một tập phim có cốt truyện riêng (episode.ts): tiếng Anh đã được soát và Whisper nghe lại trước khi render.</p></section>`;
  if (qa && plan) {
    const fc = has("factcheck.json") ? await fetch(`/files/${slug}/factcheck.json`).then((r) => r.json()).catch(() => null) : null;
    const shortWords = (plan.shorts || []).map((n) => plan.scenes[n - 1]).filter(Boolean).flatMap((s) => s.parts).reduce((n, p) => n + p.text.split(/\s+/).length, 0);
    h += `<section><h3>Câu trả lời</h3><p>${esc(plan.answer || "")}</p>
      <p><b>Chữ trên ảnh bìa:</b> ${esc(plan.thumbnail || "")}</p>
      ${plan.shorts?.length ? `<p><b>Shorts:</b> cảnh ${plan.shorts.join(", ")} · ${shortWords} chữ (khoảng ${Math.round(shortWords / 2.5)} giây)</p>` : `<p><b>Short dọc 9:16</b>, khoảng ${Math.round(plan.scenes.flatMap((s) => s.parts).reduce((n, p) => n + p.text.split(/\s+/).length, 0) / 2.5)} giây</p>`}
      <p><b>Mô tả YouTube:</b> ${esc(plan.description || "")}</p></section>`;
    if (fc) h += `<section><h3>Soát sự thật · ${fc.issues.length ? `${fc.issues.length} chỗ đã sửa` : "không có chỗ sai"}</h3>${fc.issues.length ? `<ul>${fc.issues.map((x) => `<li><b>Cảnh ${x.scene}</b>: <s>${esc(x.quote)}</s><br><small>${esc(x.problem)}</small><br>→ ${esc(x.fix)}</li>`).join("")}</ul>` : ""}</section>`;
  }
  if (has("video.mp4")) h += `<section><h3>Video</h3><video controls preload="metadata" src="/files/${slug}/video.mp4" ${has("thumbnail.jpg") ? `poster="/files/${slug}/thumbnail.jpg"` : ""}></video>
    <p class="dls">${dl(slug, "video.mp4", "Tải video", `${slug}.mp4`)}</p>
    ${thumbsOf(slug, has, "")}</section>`;
  if (job.status === "done" || job.published || job.exported) {
    const p = job.published || {}, ex = job.exported || {}, when = (x) => new Date(x.publishAt).toLocaleString("vi", { weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
    const item = (label, x) => x ? `<li>${label}: <a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a> · công khai ${when(x)}${x.manual ? " · đăng tay" : x.checked ? " · ✔ đã công khai" : ""}</li>` : "";
    const main = job.kind === "qa" ? "Bản tiếng Anh" : "Bản tiếng Việt";
    const list = [item(main, p.long), item("Bản tiếng Anh", p.en), ...(p.shorts || []).map((x, i) => item(`Short ${i + 1}`, x))].join("");
    // Laid out by hand in one folder (~/youtube/<topic>), waiting for the user's upload: the time, a box for the link.
    const fact = job.kind === "fact" || job.kind === "fact-vi";
    const waiting = [["long", main, job.kind === "qa" ? "video-tieng-anh.mp4" : "video-tieng-viet.mp4", ex.long], ...(ex.shorts || []).map((x, i) => ["short", fact ? "Short" : `Short ${i + 1}`, fact ? "short.mp4" : `short-${i + 1}.mp4`, x, i]), ["en", "Bản tiếng Anh", "video-tieng-anh.mp4", ex.en]].filter((e) => e[3]);
    const box = ([what, label, file, x, i]) => `<li><b>${label}</b> <small>(${file})</small> · công khai ${when(x)}
      <br><input id="pub-${what}-${i ?? 0}" placeholder="Dán link YouTube sau khi đăng" style="width:60%"> <button class="fixb" onclick="markPublished('${what}', ${i ?? "undefined"})">✔ Đã đăng</button></li>`;
    h += `<section><h3>YouTube</h3>${list ? `<ul>${list}</ul>` : ""}
      ${waiting.length ? `<p><a class="dl" href="/m#${job.slug}" target="_blank">📤 Mở trang đăng: nút chép lời YouTube, TikTok, Facebook và đánh dấu đã đăng</a></p><p><b>Chờ anh đăng tay.</b> Mọi video và ảnh bìa ở cùng một thư mục, làm theo tệp <code>dang-len-youtube.txt</code> trong đó (TikTok và Facebook: <code>dang-tiktok-facebook.txt</code>, hoặc trên điện thoại, bấm 📱 Điện thoại):<br><code style="user-select:all">${esc(waiting[0][3].dir)}</code></p>${waiting.some((w) => w[0] === "short") && !p.long && !fact ? `<p class="meta">Đăng video dài trước và dán link của nó: studio tự điền link vào mô tả các Short trong tệp.</p>` : ""}<ul>${waiting.map(box).join("")}</ul>` : ""}
      ${!list && !waiting.length ? `<p class="meta">${job.publishHold ? "Đang hoãn đăng." : job.shorts === undefined && !fact ? "Chưa tải về: studio chờ cắt xong Shorts (buổi tối) rồi gom cả video dài, Shorts và ảnh bìa vào một thư mục trong ~/youtube." : "Chưa tải về, chưa đăng. Studio tự gom vào ~/youtube trong ít phút; hoặc bấm nút dưới."}</p>` : ""}
      ${(job.lockedVideos || []).filter(Boolean).length ? `<div class="warn">YouTube khóa riêng tư các video studio tự tải lên (dự án Google chưa qua audit). Xóa chúng trong YouTube Studio: ${job.lockedVideos.filter(Boolean).map((x) => `<a href="https://studio.youtube.com/video/${esc(x.videoId)}/edit" target="_blank">${esc(x.videoId)}</a>`).join(", ")}. Bản để đăng tay đã được xuất lại.</div>` : ""}
      ${job.publishError ? `<div class="warn">Lần trước lỗi: ${esc(job.publishError)} (thử lại sau 1 giờ)</div>` : ""}
      <p>${job.status === "done" && !job.publishHold ? `<button class="fixb" onclick="exportNow()">📦 Tải về để đăng (gom một thư mục)</button> ` : ""}<button class="fixb" onclick="holdPublish(${!job.publishHold})">${job.publishHold ? "▶ Cho đăng" : "⏸ Hoãn đăng video này"}</button></p></section>`;
  }
  if (has("video.en.mp4")) h += `<section><h3>English version</h3><video controls preload="metadata" src="/files/${slug}/video.en.mp4" ${has("thumbnail.en.jpg") ? `poster="/files/${slug}/thumbnail.en.jpg"` : ""}></video>
    <p class="dls">${dl(slug, "video.en.mp4", "Tải video tiếng Anh", `${slug}-en.mp4`)}</p>
    ${thumbsOf(slug, has, ".en")}</section>`;
  else if (job.english) h += `<section><h3>English version</h3><div class="meta">${job.english === "ready" ? "Giọng tiếng Anh xong, render tối nay" : esc(job.english)}</div></section>`;
  if (job.shorts?.length) h += `<section><h3>Shorts (Reels, TikTok) · ${job.shorts.length} clip</h3><div style="display:flex;gap:14px;flex-wrap:wrap">${job.shorts.map((f, i) => `<div><video controls preload="metadata" style="width:240px;border-radius:12px" src="/files/${slug}/${f}"></video><br>${dl(slug, f, `Tải short ${i + 1}`, `${slug}-short-${i + 1}.mp4`)}</div>`).join("")}</div></section>`;
  if (has("costumes.png")) h += `<section class="sheet"><h3>Bảng trang phục</h3><img src="/files/${slug}/costumes.png?${Date.now()}" onclick="zoom(this.src)"></section>`;
  else if (plan && !qa) h += `<section><h3>Bảng trang phục</h3><div class="meta">Đang vẽ…</div><p>${esc(plan.look)}</p></section>`;
  if (job.notes.length) h += `<section><h3>Góp ý của bạn</h3><ul class="notes">${job.notes.map((n) => `<li><small>${new Date(n.at).toLocaleString("vi")} · ${n.on === "video" ? "video" : "kịch bản"}</small><br>${esc(n.text)}</li>`).join("")}</ul></section>`;
  if (plan) {
    h += `<section><h3>Kịch bản · ${plan.scenes.length} cảnh · ${plan.scenes.flatMap((s) => s.parts).reduce((n, p) => n + p.text.split(/\s+/).length, 0)} chữ</h3>` +
      plan.scenes.map((s, i) => `<div class="scene"><div class="num">${i + 1}</div><div>${s.visual ? `<div class="meta">${esc(s.beat)}${s.step ? ` ${s.step}` : ""} · hình: <b>${esc(s.visual.kind)}</b> — ${esc(s.visual.what)}</div>` : ""}${s.parts.map((p) => p.who ? `<div class="say"><span class="who">${esc(p.who)}</span>${p.how ? ` <span class="how">(${esc(p.how)})</span>` : ""}: “${esc(p.text)}”</div>` : `<p class="tell">${esc(p.text)}</p>`).join("")}</div></div>`).join("") + `</section>`;
    h += `<section><h3>Nhân vật và giọng</h3><table><tr><th>Nhân vật</th><th>Vai</th><th>Giọng</th><th></th></tr>` +
      plan.cast.map((c) => { const v = voices[c.name], name = voiceOf(c.name); return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td><td>${esc(name || "")}${v && v.pitch ? ` (cao độ ${v.pitch > 0 ? "+" : ""}${v.pitch})` : ""}</td><td>${name ? `<button class="play" title="Nghe giọng mẫu" onclick="play('${esc(name)}')">▶</button>` : ""}</td></tr>`; }).join("") +
      `<tr><td><b>Người kể</b></td><td></td><td>${esc(project?.voice || "")}</td><td><button class="play" onclick="play('${esc(project?.voice || "")}')">▶</button></td></tr></table></section>`;
    h += `<section><h3>Chi tiết chính và nguồn tư liệu</h3><ul>${plan.facts.map((f) => `<li>${esc(f.claim)} <small>(${esc(f.source)})</small></li>`).join("")}</ul>
      <p>${(sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a>`).join(" · ")}</p></section>`;
  }
  h += `<section><h3>Lịch sử</h3><table>${job.history.slice().reverse().map((x) => `<tr><td>${new Date(x.at).toLocaleString("vi")}</td><td>${STATUS[x.status] || x.status}</td><td>${esc(x.info || "")}</td></tr>`).join("")}</table></section>`;
  $("#detail").innerHTML = h;
}

/** Style, intro and outro: what the brain suggests (★) and what is chosen (✔); a click changes it. */
/** An English lesson's format (formats.ts): changing it writes the script again in the new one. */
function formatSection(job, format, formats) {
  const can = ["review", "rewrite", "failed"].includes(job.status);
  return `<section><h3>Khuôn bài học</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${formats.map((f) => `<button title="${esc(f.fits)}" ${f.id === format ? 'class="ok"' : can ? `onclick="setFormat('${f.id}', '${esc(f.name)}')"` : "disabled"}>${f.icon} ${esc(f.name)}${f.id === format ? " ✔" : ""}</button>`).join("")}</div>
    <p class="meta">${can ? "Đổi khuôn thì studio viết lại kịch bản theo khuôn mới (một lần viết, khoảng 25 nghìn token)." : "Đổi khuôn được khi kịch bản đang chờ duyệt."} Studio tự xoay vòng khuôn cho bài mới.</p></section>`;
}
async function setFormat(id, name) {
  if (!confirm(`Viết lại bài này theo khuôn “${name}”?`)) return;
  const r = await fetch(`/api/job/${current}/format`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ format: id }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); show(current);
}
async function artSection(job, art, redrawing) {
  if (!art || job.status === "writing" || job.status === "rejected") return "";
  ART ||= await fetch("/api/art").then((r) => r.json());
  const sg = art.suggest || {};
  const styleName = (k) => ART.styles.find((s) => s.key === k)?.name || k, themeName = (k) => ART.themes.find((t) => t.key === k)?.name || k;
  const theme = (kind) => {
    const t = ART.themes.find((x) => x.key === art[kind]);
    return `<div><b>${kind === "intro" ? "Intro (mở đầu)" : "Outro (kết thúc)"}</b>
      <select onchange="setArt({ ${kind}: this.value })">${ART.themes.map((x) => `<option value="${x.key}" ${x.key === art[kind] ? "selected" : ""}>${x.key === sg[kind] ? "★ " : ""}${esc(x.name)}</option>`).join("")}</select>
      <div class="meta" style="margin:0 0 6px">${esc(t?.for || "")}</div>
      ${t?.[kind] ? `<video controls preload="metadata" src="${t[kind]}#t=${kind === "intro" ? 2.4 : 3.6}"></video>` : `<div class="meta">Chưa có video xem trước.</div>`}</div>`;
  };
  return `<section><h3>Phong cách vẽ, intro và outro</h3>
    <div class="meta">★ Gợi ý ${sg.by === "brain" ? "của bộ não" : "theo chủ đề"}: <b>${esc(styleName(sg.style))}</b> · intro ${esc(themeName(sg.intro))} · outro ${esc(themeName(sg.outro))}${sg.why ? `: <i>${esc(sg.why)}</i>` : ""}</div>
    <p style="margin:12px 0 4px"><b>Phong cách vẽ</b></p>
    <div class="styles">${ART.styles.map((s) => `<div class="sty ${s.key === art.style ? "on" : ""}" onclick="setArt({ style: '${s.key}' })" title="${esc(s.for)}">
      ${s.sample ? `<img src="${s.sample}">` : `<div class="ph">chưa có ảnh mẫu</div>`}
      ${s.key === sg.style ? `<span class="star">★ gợi ý</span>` : ""}${s.key === art.style ? `<span class="chosen">✔ đang chọn</span>` : ""}
      <b>${esc(s.name)}</b><small>${esc(s.for)}</small></div>`).join("")}</div>

const CLIP = [];
const clip = (text, label = "Chép") => { CLIP.push(text); return `<button class="cp" onclick="copyClip(${CLIP.length - 1}, this)">📋 ${label}</button>`; };
async function copyClip(i, btn) {

/** Which video and platform the Lời đăng section shows (kept while the page redraws). */
const POSTSEL = { slug: null, i: 0, pl: {} };
const PLAT = { youtube: "▶ YouTube", tiktok: "♪ TikTok", facebook: "f Facebook" };
/** The facts to get right before anything else (the file, the channel, the time): chips on top. */
const isFact = (r) => /^(Tệp tải lên|Kênh|Tài khoản|Đăng lên|Chế độ hiển thị|Lịch đăng|Lên lịch)$/.test(r.label);

const LIMIT = { "Tiêu đề": 100, "Mô tả": 5000 };
function postWords(posts, yt) {
  CLIP.length = 0;

  POSTSEL.i = Math.min(POSTSEL.i, posts.length - 1);

  // One platform: chips (file, channel, time), the boxes to paste (left), the choices on the upload page in its order (right).
  const pane = (p, form, pl, platform) => {
    const facts = form.filter((r) => !r.copy && isFact(r)), copies = form.filter((r) => r.copy), picks = form.filter((r) => !r.copy && !isFact(r) && r.label !== "Đăng xong"), end = form.find((r) => r.label === "Đăng xong");
    const fld = (r) => { const lim = pl === "youtube" ? LIMIT[r.label] : undefined, n = [...r.value].length;
      return `<div class="fld"><div class="fh"><b>${esc(r.label)}</b><small class="${lim && n > lim ? "over" : ""}">${fmt(n)}${lim ? ` / ${fmt(lim)}` : ""} ký tự</small><span class="grow"></span>${clip(r.value)}</div><div class="fv">${esc(r.value)}</div>${r.note ? `<div class="fn">${esc(r.note)}</div>` : ""}</div>`; };
    return `<div class="ppane ${platform === (POSTSEL.pl[p.file] || "youtube") ? "on" : ""}" data-pl="${platform}">
      <div class="facts">${facts.map((r) => `<div class="fact"><small>${esc(r.label)}</small><b>${esc(r.value)}</b>${r.note ? `<small>${esc(r.note)}</small>` : ""}</div>`).join("")}</div>
      <div class="pgrid"><div><p class="colh">Chép rồi dán</p>${copies.map(fld).join("") || `<p class="meta">Không có ô nào cần chép.</p>`}</div>
        <div><p class="colh">Chọn trên trang tải lên (theo thứ tự)</p><ul class="picks">${picks.map((r) => `<li class="${r.must ? "must" : ""}"><span class="k">${esc(r.label)}</span><span class="v">${esc(r.value)}</span>${r.note ? `<span class="n">${esc(r.note)}</span>` : ""}</li>`).join("")}</ul>
        ${end ? `<p class="ptail">✔ ${esc(end.value)}</p>` : ""}</div></div></div>`;
  };
  const card = (p, i) => `<div class="pcard" data-i="${i}" style="${i === POSTSEL.i ? "" : "display:none"}">
      <div class="ptabs">${plats(p).map((pl) => `<button class="ptab ${pl === (POSTSEL.pl[p.file] || "youtube") ? "on" : ""}" onclick="pickPlat(${i}, '${p.file}', '${pl}')">${pl === "facebook" && p.what === "short" ? "f Facebook Reels" : PLAT[pl]}${doneOn(p, pl) ? `<span class="ok-mark">✔ đã đăng</span>` : ""}</button>`).join("")}</div>
      ${pane(p, p.form, "youtube", "youtube")}${Object.entries(p.forms || {}).map(([pl, form]) => pane(p, form, pl, pl)).join("")}</div>`;
  const pill = (p, i) => `<button class="vp ${i === POSTSEL.i ? "on" : ""}" onclick="pickPost(${i})"><b>${esc(p.label)}</b><small>${p.publishAt ? when(p.publishAt) : "chưa xếp giờ"} · ${esc(p.account)}</small>
      <div class="marks">${plats(p).map((pl) => doneOn(p, pl) ? `<i>✔ ${PLAT[pl].split(" ")[1]}</i>` : `○ ${PLAT[pl].split(" ")[1]}`).join(" · ")}</div></button>`;
  return `<section><h3>Lời đăng</h3><p class="meta">Chọn video, chọn nơi đăng, bấm 📋 Chép rồi dán vào ô cùng tên. Giống tệp <code>dang-len-youtube.txt</code> và <code>dang-tiktok-facebook.txt</code> trong thư mục đăng.</p>
    <div class="vpick">${posts.map(pill).join("")}</div>${posts.map(card).join("")}</section>`;
}

  return `<section><h3>Xu hướng (gợi ý cho bộ đề xuất chủ đề)</h3>
    <p><b>Dịp sắp tới (3 tuần):</b> ${[...t.seasonal.vi, ...t.seasonal.en.filter((x) => !/Vietnam/.test(x))].map(esc).join(" · ") || "chưa có"}</p>
    ${t.hasKey ? (pop.length ? pop.map(([line, list]) => `<p><b>${esc(line)}</b>: ${list.slice(0, 5).map((v) => `${esc(v.title)} <small>(${v.views.toLocaleString("vi")})</small>`).join(" · ")}</p>`).join("") + `<p class="meta">Cập nhật ${esc(t.day || "")}</p>` : `<p class="meta">Có API key, sẽ cập nhật trong lượt chạy tới.</p>`)
      : `<div class="warn">Chưa có <b>studio/secrets/youtube_api_key.txt</b>: chưa xem được video đang hot và lượt xem của kênh mình (README, mục "Đăng YouTube", bước API key). Lịch mùa lễ vẫn chạy.</div>`}</section>`;
}
async function savePublish(key) {
  const split = (v) => v.split(/[,\s]+/).filter(Boolean);
  const mode = $(`#mode-${key}`).value;
  if (mode === "auto" && !confirm("Chỉ bật Tự đăng khi dự án Google đã qua audit của YouTube. Chưa audit thì video bị khóa ở chế độ riêng tư. Bật?")) return;
  const r = await fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel: key, mode, long: split($(`#long-${key}`).value), shorts: split($(`#shorts-${key}`).value), ...($(`#english-${key}`) ? { english: split($(`#english-${key}`).value) } : {}) }) }).then((r) => r.json());
  if (r.error) alert(r.error);
  showYoutube();
}
async function exportAll() {
  const r = await fetch("/api/export-all", { method: "POST" }).then((r) => r.json());
  alert(r.error ? `Lỗi: ${r.error}` : r.dirs.length ? `Đã gom ${r.dirs.length} chủ đề vào ${r.exportDir}:\n\n${r.dirs.join("\n")}` : "Không có bài nào chờ đăng (chỉ bài đã duyệt xong, còn video chưa đăng).");
}
async function exportNow() {
  const r = await fetch(`/api/job/${current}/export`, { method: "POST" }).then((r) => r.json());
  if (r.error) alert(`Lỗi: ${r.error}`);
  else if (!r.dirs.length) alert("Không còn video nào để tải về: đã đăng hết.");
  else alert(`Đã gom vào:\n${r.dirs[0]}`);
  await load(); show(current);
}
async function markPublished(what, index) {
  const url = $(`#pub-${what}-${index ?? 0}`).value.trim();
  if (!url) return alert("Dán link YouTube của video vừa đăng");
  const r = await fetch(`/api/job/${current}/published`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ what, index, url }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); show(current);
}
async function socialDone(platform, what, index, done) {
  const r = await fetch(`/api/job/${current}/social`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform, what, index, done }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  const y = $("#detail").scrollTop; await load(); await show(current); $("#detail").scrollTop = y;
}
async function holdPublish(hold) {
  await fetch(`/api/job/${current}/hold`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hold }) });
  show(current);
}

async function showTokens() {
  const t = await fetch("/api/tokens").then((r) => r.json());
  const byJob = {};
  for (const e of t.entries) { const k = e.job; (byJob[k] ||= { n: 0, w: 0, out: 0 }); byJob[k].n++; byJob[k].w += e.weighted; byJob[k].out += e.output; }
  const st = t.settings;
  $("#detail").innerHTML = `<h2>Token đã dùng</h2>
    <section><h3>Điều khiển</h3>
      <p>${st.paused ? "⏸ <b>Claude đang tạm dừng</b>: việc cần Claude (viết kịch bản, chỉ đạo cảnh, dựng thời đại) đang chờ; render vẫn chạy." : "▶ <b>Đang tự động</b>: Claude làm việc trong giới hạn bên dưới."}</p>
      <p><button class="${st.paused ? "ok" : "no"}" style="font-size:16px;padding:10px 18px;border-radius:10px;border:2px solid;cursor:pointer" onclick="setPaused(${!st.paused})">${st.paused ? "▶ Tiếp tục tự động" : "⏸ Tạm dừng Claude (tôi cần token)"}</button></p>
      <table>
        <tr><td>Trần mỗi ngày</td><td><input id="capDay" type="number" step="10000" value="${st.perDayTokens}"></td></tr>
        <tr><td>Trần mỗi kịch bản (viết + trang phục + thời đại mới)</td><td><input id="capJob" type="number" step="10000" value="${st.perJobTokens}"></td></tr>
        <tr><td>Trần mỗi lần làm video (chỉ đạo cảnh, sửa)</td><td><input id="capProd" type="number" step="10000" value="${st.perProduceTokens}"></td></tr>
      </table>
      <p><button class="fixb" style="font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid;cursor:pointer" onclick="saveCaps()">Lưu giới hạn</button></p>
    </section>
    <div class="meta">Hôm nay ${fmt(t.today)} / trần ${fmt(t.settings.perDayTokens)} · trần mỗi kịch bản ${fmt(t.settings.perJobTokens)} · trần mỗi lần làm video ${fmt(t.settings.perProduceTokens)}. Token "quy đổi": token đọc lại từ bộ nhớ đệm tính 1/10.</div>
    <section><h3>Theo chủ đề</h3><table><tr><th>Chủ đề</th><th>Lần gọi</th><th>Token quy đổi</th><th>Token Claude viết ra</th></tr>
    ${Object.entries(byJob).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${fmt(v.w)}</td><td>${fmt(v.out)}</td></tr>`).join("")}</table></section>
    <section><h3>Từng lần gọi (mới nhất trước)</h3><table><tr><th>Lúc</th><th>Chủ đề</th><th>Bước</th><th>Mô hình</th><th>Token</th><th>Giây</th></tr>
    ${t.entries.slice().reverse().slice(0, 100).map((e) => `<tr><td>${new Date(e.at).toLocaleString("vi")}</td><td>${esc(e.job)}</td><td>${esc(e.step)}</td><td>${esc(e.model)}</td><td>${fmt(e.weighted)}${e.ok ? "" : " ✘"}</td><td>${e.seconds}</td></tr>`).join("")}</table></section>`;
}

window.renderFrame = () => {};
window.ready = new Promise((r) => setTimeout(r, 2500)); // for screenshots
async function setPaused(paused) {
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paused }) });
  await load(); if (tab === "tokens") showTokens();
}
async function saveCaps() {
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ perDayTokens: $("#capDay").value, perJobTokens: $("#capJob").value, perProduceTokens: $("#capProd").value }) }).then((r) => r.json());
  if (r.error) return alert(r.error);
  await load(); showTokens();
}
load().then(() => { if (["#youtube", "#tokens", "#calendar"].includes(location.hash)) { tab = location.hash.slice(1); drawTabs(); $("#list").innerHTML = ""; return tab === "youtube" ? showYoutube() : tab === "calendar" ? showCalendar() : showTokens(); } const slug = decodeURIComponent(location.hash.slice(1)); if (slug && jobs.some((j) => j.slug === slug)) { const j = jobs.find((x) => x.slug === slug); tab = (TABS.find((t) => inTab(j, t)) || TABS[0])[0]; drawTabs(); show(slug); } });
setInterval(() => { load(); }, 15000);
</script>
</body>
</html>
